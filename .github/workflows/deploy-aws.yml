name: Deploy (AWS)

# Merge to main → build/push the demo image → terraform apply (demo stack) →
# start an App Runner deployment → deploy the frontend → smoke-test the live
# URL. Five minutes, no database, no migrations, no pipeline (s52).
# Auth is GitHub OIDC into the data-qa-github-deploy IAM role (no stored keys —
# the role + provider were created by infra/terraform/bootstrap). ci.yml stays
# the PR gate; this only runs post-merge (or manually via workflow_dispatch).
on:
  push:
    branches: [main]
    paths-ignore:
      - ".lavish/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

# Never run two deploys at once (terraform state lock would block anyway).
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE: arn:aws:iam::089783391188:role/data-qa-github-deploy
  # Scripts default to the local data-qa SSO profile; empty = use OIDC creds.
  AWS_PROFILE: ""
  TF_VAR_aws_profile: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push the demo image (linux/amd64)
        run: ./scripts/aws_build_push.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # plain stdout so -raw outputs work in scripts

      - name: Terraform apply (demo)
        working-directory: infra/terraform/demo
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      # auto_deployments is off (it bills $1/service/month for the ECR trigger),
      # so the release step is explicit: point the service at the image just
      # pushed. UpdateService from the apply above may still be in flight, in
      # which case start-deployment is rejected — settle first, then start.
      - name: Start the App Runner deployment
        run: |
          unset AWS_PROFILE
          ./scripts/wait_apprunner.sh "apply-triggered update, before start-deployment"
          ARN=$(terraform -chdir=infra/terraform/demo output -raw apprunner_service_arn)
          aws apprunner start-deployment --service-arn "$ARN" >/dev/null
          ./scripts/wait_apprunner.sh "new image, before smoke test"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build & deploy frontend (S3 + CloudFront)
        run: |
          VITE_API_URL=$(terraform -chdir=infra/terraform/demo output -raw backend_api_url)
          export VITE_API_URL
          ./scripts/deploy_frontend.sh

      - name: Cloud smoke test (live URL)
        run: ./scripts/cloud_smoke.sh
