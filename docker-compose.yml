# data-qa-agent :: local dev stack (Decision E: Phase 0, all in `dev`).
# `docker compose up --build` boots the whole app on localhost.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataqa
    ports:
      - "5434:5432"   # 5432/5433 are used by other local containers; internal net still uses db:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataqa"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot job: applies Alembic migrations (schema + RLS + seed). Runs the SAME
  # migrations as the Azure db-migrate job. Dataset data is loaded by `pipeline`.
  migrate:
    build:
      context: .
      dockerfile: services/db-migrate/Dockerfile
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/dataqa
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # One-shot job: dlt ingests the CSVs into `raw`, then dbt builds the marts.
  # Defaults to the small committed sample; `make pipeline` loads the full CSVs.
  pipeline:
    build:
      context: .
      dockerfile: services/data-pipeline/Dockerfile
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@db:5432/dataqa
      PIPELINE_SOURCE: ${PIPELINE_SOURCE:-sample}
      # s32 W2: the pipeline records its own freshness (marts age + dbt pass) to
      # app.pipeline_runs through the backend, so the deck's freshness lamp is fed
      # by the job that changes the data. Best-effort: the pipeline runs BEFORE
      # backend-api starts on a cold `make up`, so the first record is skipped
      # with a log line and the next run fills it in.
      OPS_API_URL: http://backend-api:8000
      OPS_INGEST_TOKEN: ${OPS_INGEST_TOKEN:-dev-ops-token}
    volumes:
      - ./data:/data:ro
      - dbt_target:/app/dbt/target
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Ad hoc: serves the dbt docs UI (lineage graph, model/column descriptions,
  # source freshness) for reviewing raw -> staging -> marts. Not part of `make
  # up` (profile-gated) — run `make pipeline-docs` after `make pipeline`.
  pipeline-docs:
    profiles: ["docs"]
    build:
      context: .
      dockerfile: services/data-pipeline/Dockerfile
    command:
      [
        "dbt", "docs", "serve",
        "--host", "0.0.0.0", "--port", "8080", "--no-browser",
        "--project-dir", "dbt", "--profiles-dir", "dbt",
      ]
    # Not :ro — `dbt docs serve` writes its index.html into target/ before serving.
    volumes:
      - dbt_target:/app/dbt/target
    ports:
      - "8180:8080"

  backend-api:
    build: ./services/backend-api
    environment:
      APP_ENV: dev
      # AUTH_MODE=dev uses the local dev-auth stub. Set AUTH_MODE=google plus
      # GOOGLE_CLIENT_ID + ADMIN_EMAILS (in .env) to switch to real Google Sign-in.
      AUTH_MODE: ${AUTH_MODE:-dev}
      # s38: flip DEMO_MODE=1 (in .env or the shell) to run the local stack as
      # the walk-in demo — replayed chat, local governed SQL executor, LLM
      # controls flagged. Default 0 keeps dev fully live.
      DEMO_MODE: ${DEMO_MODE:-0}
      DATABASE_URL: postgresql+asyncpg://app_user:app_pw@db:5432/dataqa
      # Read-only executor role for demo mode's local SQL path (s38 P4) —
      # same role the data-agent connects as.
      AGENT_RO_DATABASE_URL: postgresql+asyncpg://agent_ro:agent_pw@db:5432/dataqa
      # Elevated read-only role (BYPASSRLS, SELECT-only; migration 0012). Used by
      # exactly one thing here: the /ops rollup, which aggregates across ALL users
      # and so cannot run under any single user's RLS context (an empty context
      # sees zero rows and would write a rollup of zeros).
      ADMIN_RO_DATABASE_URL: postgresql+asyncpg://admin_ro:admin_pw@db:5432/dataqa
      AGENT_URL: http://data-agent:8100
      JWT_SECRET: dev-secret-change-me
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Local dev only: disable the per-user daily ask caps (0 = off) so repeated
      # same-day `make smoke` / journey pytest runs against the persistent dev DB
      # never 429. Cloud deployments keep the config.py defaults (free 5, paid 10).
      ASK_DAILY_LIMIT_FREE: "0"
      ASK_DAILY_LIMIT_PAID: "0"
      # s32: machine token for POST /ops/ingest/* — the k6, red-team, deploy and
      # pipeline writers. A fixed dev value so `make loadtest` / `make redteam` /
      # the pipeline's freshness record just work locally; in AWS it is generated
      # by Terraform. Empty would CLOSE the endpoint (404), which is the default.
      OPS_INGEST_TOKEN: ${OPS_INGEST_TOKEN:-dev-ops-token}
      # Optional — ships backend traces to Logfire Cloud; local-only otherwise.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      # s43 M1: self-hosted traces land in the MLflow server (OTLP ingest at
      # /v1/traces), so one UI carries traces + eval runs + the agent registry.
      # Set OTLP_ENDPOINT= (empty) to turn span export off entirely.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT-http://mlflow:5000}
      # MLflow routes OTLP spans by experiment id (x-mlflow-experiment-id).
      # `make mlflow-init` creates data-qa/traces first, so 1 is its id on a
      # fresh store; the init target warns if yours differs.
      MLFLOW_TRACE_EXPERIMENT_ID: ${MLFLOW_TRACE_EXPERIMENT_ID:-1}
      # s35: Slack's workspace signing secret, used to verify X-Slack-Signature.
      # A fixed dev value so the signature path is exercisable locally without a
      # real workspace; empty CLOSES the Slack endpoint (404), which is the
      # config.py default and the right posture for any env that isn't using it.
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-dev-slack-secret}
      # s37: bot token for the @mention surface (Events API). Empty = mention
      # events are acked and dropped; the slash command works without it.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      # s36: the MCP surface is mounted here at /mcp rather than run as its own
      # service. Clients authenticate with a dpk_ key minted for surface="mcp",
      # so there is no server-side key to configure. Empty MCP_ALLOWED_HOSTS
      # leaves the SDK's DNS-rebinding allowlist off — the key gate is the
      # control; see app/mcp_surface.py.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      # s40 M1: the queue seam. QUEUE_MODE=on enqueues chat to Redis Streams
      # (make queue-up); off keeps today's direct hop. The bound sheds with a
      # clean 429 + Retry-After; the deadline rides in each job.
      QUEUE_MODE: ${QUEUE_MODE:-off}
      REDIS_URL: redis://redis:6379/0
      QUEUE_MAX_DEPTH: ${QUEUE_MAX_DEPTH:-10}
      JOB_DEADLINE_S: ${JOB_DEADLINE_S:-240}
    ports:
      # Host port is overridable (API_HOST_PORT in .env) so a local dev machine
      # that already has something on 8000 can move the app instead of it.
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      pipeline:
        condition: service_completed_successfully

  data-agent:
    build: ./services/data-agent
    # Anchored so agent-worker (s40 M1) runs the same image with the same
    # environment — one config surface, two entrypoints.
    environment: &agent-env
      APP_ENV: dev
      AGENT_DATABASE_URL: postgresql+asyncpg://agent_ro:agent_pw@db:5432/dataqa
      # Elevated read-only role for the admin SQL editor (BYPASSRLS, all schemas);
      # created by migration 0012. Only role==admin editor queries use it.
      ADMIN_RO_DATABASE_URL: postgresql+asyncpg://admin_ro:admin_pw@db:5432/dataqa
      # The dbt manifest lets get_schema() ground the LLM in the real marts.
      DBT_MANIFEST: /dbt-target/manifest.json
      # Provider is pluggable (Decision G): LLM_PROVIDER picks deepseek (default) or
      # anthropic; empty key for the selected provider = offline stub.
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # run_analysis executor (restructure Phase B): "pyodide" = hardened WASM
      # runtime (no syscalls; the image ships Node + pyodide), "subprocess" = the
      # Phase A restricted-builtins process. The image has Node, so default it on.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-pyodide}
      # Optional — ships agent traces to Logfire Cloud; empty = local-only tracing.
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      # s43 M1: self-hosted traces to the MLflow server (see backend-api).
      OTLP_ENDPOINT: ${OTLP_ENDPOINT-http://mlflow:5000}
      MLFLOW_TRACE_EXPERIMENT_ID: ${MLFLOW_TRACE_EXPERIMENT_ID:-1}
      # s40 (D2): LLM_STUB=1 forces the deterministic stub answer, streamed
      # across STUB_LATENCY_S seconds — the zero-spend workload for E2-E8 and
      # the C-series load runs.
      LLM_STUB: ${LLM_STUB:-0}
      STUB_LATENCY_S: ${STUB_LATENCY_S:-20}
      # s40 M0: pre-load embeddings + spawn one sandbox before serving, so the
      # healthcheck below only goes green on a warm replica.
      WARMUP_ON_START: "1"
      # s40 M1: where the worker (and future queue reads) find the job streams.
      REDIS_URL: redis://redis:6379/0
      # s45: loop engine — "pydantic_ai" (champion, default) or "agent_sdk"
      # (Claude Agent SDK challenger). LLM_STUB still wins over both.
      AGENT_RUNTIME: ${AGENT_RUNTIME:-pydantic_ai}
      # s45: subscription auth for the agent_sdk runtime inside the container
      # (`claude setup-token` on the host, then set in .env). The runtime blanks
      # ANTHROPIC/DEEPSEEK keys in the CLI subprocess env so this token wins.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # s46: the answer is a Google Slides deck + Sheet. One generating account,
      # dev only — prod/demo runs no data-agent at all, so these are simply
      # never set there and the deck tools are never registered. A *Desktop app*
      # OAuth client, distinct from the Web client GOOGLE_CLIENT_ID that
      # backend-api uses for Google Sign-in — hence the DECK_ prefix.
      GOOGLE_DECK_CLIENT_ID: ${GOOGLE_DECK_CLIENT_ID:-}
      GOOGLE_DECK_CLIENT_SECRET: ${GOOGLE_DECK_CLIENT_SECRET:-}
      GOOGLE_DECK_REFRESH_TOKEN: ${GOOGLE_DECK_REFRESH_TOKEN:-}
      # A curated layout pack; empty uses the built-in catalogue.
      GOOGLE_SLIDES_TEMPLATE_ID: ${GOOGLE_SLIDES_TEMPLATE_ID:-}
      DECK_EXPORT: ${DECK_EXPORT:-1}
      # Public read-only sharing. Separate flag on purpose: this is the one call
      # that puts a file outside RLS, and a public link cannot be un-published.
      DECK_PUBLIC: ${DECK_PUBLIC:-0}
      MAX_SLIDES: ${MAX_SLIDES:-8}
    volumes:
      - dbt_target:/dbt-target:ro
    ports:
      # Host port is overridable (AGENT_HOST_PORT) like the backend's; the
      # in-network address stays data-agent:8100. Worker replicas (s40 M1)
      # publish nothing, so scaling never contends for this port.
      - "${AGENT_HOST_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      pipeline:
        condition: service_completed_successfully

  # s40 M1 (D1): the queue. One redis container carries the shared agent:jobs
  # stream (consumer group -> ack/pending/redelivery), a per-job frames stream
  # the backend relays as SSE, and the DLQ. In-memory on purpose: losing it
  # loses queued jobs, which users simply re-ask — the experiment's documented
  # trade (same one SQS's managed durability would buy back in prod).
  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # s40 M1: N of these consume agent:jobs — the same data-agent image running
  # the consumer-group loop instead of uvicorn. No published ports, so
  # `--scale agent-worker=N` just works; each replica joins the group as
  # consumer-$HOSTNAME. Prometheus scrapes :9100 over the compose network via
  # DNS discovery (see ops/prometheus.yml).
  agent-worker:
    build: ./services/data-agent
    command: ["python", "-m", "agent.worker"]
    profiles: ["queue"]
    # A crashed worker must rejoin the consumer group, not strand the queue —
    # the reaper only redelivers to workers that are actually alive.
    restart: unless-stopped
    environment:
      <<: *agent-env
      # The worker warms itself before consuming (agent/worker.py); the FastAPI
      # lifespan warm-up would be dead code on this entrypoint anyway.
      WARMUP_ON_START: "0"
      # PID-1 python block-buffers stdout in a container; crash forensics need
      # log lines in the order they happened.
      PYTHONUNBUFFERED: "1"
      # s41 D2: answer-slots per worker process (1 = serial; >1 interleaves
      # LLM waits on one event loop).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - dbt_target:/dbt-target:ro
    depends_on:
      redis:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully

  # s40 M1 (D4, first-class): metrics collector + dashboard, obs profile.
  # `make queue-up` enables queue+obs together; `COMPOSE_PROFILES=obs make up`
  # gives the direct-path baselines (E1/E2) the same dashboard.
  # s41 D1: per-container CPU/memory — the saturation golden signal. Not
  # cAdvisor: v0.49's legacy Docker client fails Docker Desktop's info
  # handshake and every series comes out an anonymous cgroup id. This ~100-line
  # stdlib exporter asks the Docker API directly and labels series with the
  # compose service, so worker replicas show as separate lines in Grafana.
  stats-exporter:
    image: python:3.12-alpine
    profiles: ["obs"]
    command: ["python", "/stats_exporter.py"]
    volumes:
      - ./ops/stats_exporter.py:/stats_exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["obs"]
    ports:
      # Published for ad-hoc PromQL during experiments; Grafana uses the
      # compose network and doesn't need this.
      - "${PROM_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    environment:
      # Local experiment tooling: no login wall between a run and its panels.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # s43 M0: the MLOps plane. One MLflow server carries all three surfaces —
  # traces (OTLP ingest at /v1/traces, replacing the s37 Jaeger container),
  # experiments & eval runs (`make eval` logs one run each), and the agent
  # registry with @champion/@challenger aliases. sqlite + ./.mlflow volume
  # mirrors the ConvFinQA-agent setup (decision D3); unlike Jaeger's in-memory
  # store, traces survive restarts. Host port 5500 because ConvFinQA's MLflow
  # owns 5000 on this machine (MLFLOW_HOST_PORT overrides, like API_HOST_PORT).
  #   UI: http://localhost:5500
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/store/mlflow.db
      --artifacts-destination /mlflow/artifacts
    environment:
      # The server's DNS-rebinding guard only accepts localhost Hosts by
      # default; in-network span export arrives as Host "mlflow:5000" and was
      # 403'd without this. Keep it to the compose-internal name + localhost.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost,127.0.0.1,localhost:${MLFLOW_HOST_PORT:-5500},127.0.0.1:${MLFLOW_HOST_PORT:-5500}"
    ports:
      - "${MLFLOW_HOST_PORT:-5500}:5000"
    volumes:
      - ./.mlflow:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${API_HOST_PORT:-8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5230:5230"
    depends_on:
      - backend-api

volumes:
  dbdata:
  dbt_target:   # dbt manifest/catalog shared from pipeline -> data-agent
