# s46 proof set — two questions that prove the Sheets/Slides loop.
#
# The pre-s46 pack (32 cases, of which only 2 were ever curated) is
# decommissioned: it graded an in-browser report contract that no longer exists.
# These two cover the shapes the layout catalogue is actually asked for — a
# chart-carried trend and a ranking whose rows are the answer.
#
# G5 asserts CONTENT, never layout identity. The agent picks the layout, so a
# golden that pinned one would grade a coin flip. The manifest records the
# layout and every option passed, for reading back — not for asserting on.
pack: nsw_property
dataset: nsw_rent
cases:
- case_key: nsw_rent-which-postcodes-had-the-fastest-rent-growth-over-0980
  question: Which postcodes had the fastest rent growth over the last two years?
  dataset: nsw_rent
  tier: T2
  as_user: user1
  holdout: false
  origin_env: dev
  authoring_status: ready
  expectation: A ranked list of postcodes by weekly-rent growth over the last 2 years, with an n_rented
    floor so thin postcodes don't dominate.
  tags:
  - s46-proof
  - shape:table
  grader:
    kind: ranked_set
    key: postcode
    k: 5
    expect_chart: true
    min_slides: 1
  # Re-authored: the previous golden_sql here was `SELECT month FROM
  # marts.property_rent`, which returns no postcode column at all. A ranked_set
  # grader keyed on `postcode` then compared an EMPTY golden against whatever the
  # agent produced and scored 1.0 unconditionally — the case passed regardless of
  # the answer. Verified against the live mart before being written down.
  #
  # Rent is weighted (total_weekly_rent / n_rented), never a mean of means, and
  # the n_rented >= 200 floor per window is what stops a postcode with three
  # bonds from topping the ranking on noise.
  golden_sql: |
    WITH windowed AS (
      SELECT postcode,
             sum(total_weekly_rent) FILTER (WHERE month >= DATE '2025-06-01') AS rent_now,
             sum(n_rented)          FILTER (WHERE month >= DATE '2025-06-01') AS n_now,
             sum(total_weekly_rent) FILTER (WHERE month <  DATE '2024-06-01') AS rent_then,
             sum(n_rented)          FILTER (WHERE month <  DATE '2024-06-01') AS n_then
      FROM marts.property_rent
      WHERE month >= DATE '2023-06-01'
      GROUP BY postcode
    )
    SELECT postcode,
           round((rent_now / NULLIF(n_now, 0))::numeric, 2)   AS avg_rent_now,
           round((rent_then / NULLIF(n_then, 0))::numeric, 2) AS avg_rent_then,
           round(((( rent_now / NULLIF(n_now, 0))
                 / NULLIF(rent_then / NULLIF(n_then, 0), 0)) - 1)::numeric * 100, 2)
             AS rent_growth_pct
    FROM windowed
    WHERE n_now >= 200 AND n_then >= 200
    ORDER BY rent_growth_pct DESC
    LIMIT 10
  golden_sandbox: |
    ranked = df.sort_values("rent_growth_pct", ascending=False).head(10)
    result = skills.build_report(
        summary=(
            f"**{ranked.iloc[0]['postcode']}** led NSW rent growth at "
            f"**{ranked.iloc[0]['rent_growth_pct']:.1f}%** over the last two years."
        ),
        main_table=ranked[["postcode", "avg_rent_then", "avg_rent_now", "rent_growth_pct"]],
    )
  golden_answer: |
    Over the two years to mid-2025, postcode 2820 led NSW weekly rent growth at about
    +25%, with average weekly rent rising from roughly $426 to $534. 2519 (+22%, $605 →
    $740) and 2113 (+22%, $709 → $863) followed, then 2281 (+22%) and 2299 (+20%). Rent
    is weighted by bond count (total_weekly_rent / n_rented), never a mean of medians,
    and postcodes with fewer than 200 bonds in either window are excluded so a handful
    of high-value leases cannot top the ranking on noise.
  label: high
  checkpoints:
    sql:
      key_cols:
      - postcode
    analysis:
      derived_cols:
      - rent_growth_pct
- case_key: nsw_rent-median-weekly-rent-2br-units-postcode-2077-latest-month-s48a1
  question: What was the median weekly rent for 2-bedroom units in postcode 2077 in the latest month?
  dataset: nsw_rent
  tier: T1
  as_user: user1
  holdout: false
  origin_env: dev
  authoring_status: ready
  expectation: The single most recent month's median weekly rent for 2-bedroom units in postcode
    2077, as a scalar KPI (718 as at 2026-05-01, verified against the live mart).
  tags:
  - s48-gate
  - shape:scalar
  grader:
    kind: scalar
    tolerance_pct: 1.0
    expect_chart: true
    min_slides: 2
  golden_sql: |
    SELECT median_weekly_rent
    FROM marts.property_rent
    WHERE postcode = '2077' AND property_type = 'unit' AND bedroom_band = '2'
      AND month = (
        SELECT max(month) FROM marts.property_rent
        WHERE postcode = '2077' AND property_type = 'unit' AND bedroom_band = '2'
      )
  golden_sandbox: |
    latest = skills.latest_value(df, month_col="month", value_col="median_weekly_rent")
    result = skills.build_report(
        summary=(
            f"2-bedroom units in postcode 2077 had a median weekly rent of "
            f"**${latest['value']:,.0f}** as at {latest['month']}."
        ),
        headlines=[
            {"label": "Median Weekly Rent", "value": f"${latest['value']:,.0f}", "basis": latest["month"]},
        ],
        main_chart=skills.trend_chart(
            skills.trend_series(df, month_col="month", value_col="median_weekly_rent"),
            title="2BR Unit Median Weekly Rent — Postcode 2077",
        ),
    )
  golden_answer: |
    The median weekly rent for 2-bedroom units in postcode 2077 was $718 in the latest
    month on record, May 2026 — up from $680 in March and roughly flat against April's
    $720. It is a single postcode/property-type/bedroom-band series, so the answer is
    one number with its month, not an average across bands.
  label: high
  calibration_examples:
  - label: medium
    answer: |
      2-bedroom units in postcode 2077 rented for a median of about $720 a week
      recently, based on the most recent months of bond lodgements.
  - label: low
    answer: |
      Median weekly rent in postcode 2077 was $606.92, averaged across all property
      types and bedroom bands over the last twelve months.
  checkpoints:
    analysis:
      expected_skills:
      - latest_value
      - build_report
    deck:
      kpi_label_contains: rent
