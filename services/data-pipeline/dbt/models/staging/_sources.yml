version: 2

sources:
  - name: propertyiq_staging
    description: >
      The shared clean layer published by propertyiq_getdata (database
      `propertyiq` on the central cluster), imported here as foreign tables over
      postgres_fdw by migration 0040. Typed, cleaned, record grain; column names
      are propertyiq's contract (dbt/models/staging/_staging.yml there). This
      project builds its marts and RLS on top and ingests nothing itself.
    schema: propertyiq_staging
    tables:
      - name: property_sales
        description: One row per residential NSW sale (RESIDENCE, $10k-$8M, 2010+), from NSW Valuer General weekly files.
      - name: property_rent
        description: One row per NSW rental bond lodgement (positive weekly rent, 2010+).
      - name: geo_postcode
        description: Postcode -> SA2/SA3/SA4/GCCSA/state (ABS ASGS).
      - name: econ_series
        description: >
          ABS + RBA economic series, long format, newest vintage per dataset:
          one row per (series_id, period_start). Join econ_headline_series on
          series_id to pick headline measures by name.
      - name: econ_headline_series
        description: Curated series_id -> measure/region/adjustment map (unemployment_rate_pct, mean_dwelling_price_k, cash_rate_target_pct, ...).
