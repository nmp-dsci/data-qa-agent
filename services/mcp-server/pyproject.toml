[project]
name = "mcp-server"
version = "0.1.0"
description = "data-qa-agent MCP server: governed property-data tools for MCP clients"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.14.2",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["mcp_server"]
